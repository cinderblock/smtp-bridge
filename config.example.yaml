# smtp-bridge configuration example.
# Copy to config.yaml and edit. Run: smtp-bridge -config config.yaml

# One or more listeners, each with its own transport-security mode:
#   none      plaintext only; STARTTLS not advertised (trusted networks only)
#   starttls  plaintext that advertises STARTTLS; clients upgrade in place (587/25/2525)
#   implicit  TLS from the first byte, a.k.a. SMTPS (465 and non-standard TLS ports)
# On a starttls listener AUTH requires STARTTLS first; set insecure_auth: true to
# allow AUTH without it (only for legacy senders on a trusted path).
listeners:
  - { address: ":2525", tls: "starttls" }
  # - { address: ":25",   tls: "starttls" }
  # - { address: ":587",  tls: "starttls" }
  # - { address: ":465",  tls: "implicit" }
  # - { address: ":5465", tls: "implicit" }   # non-standard implicit-TLS port

# Hostname announced in the SMTP greeting / EHLO.
hostname: "smtp-bridge.local"

# Reject DATA larger than this many bytes (default 25 MiB).
max_message_bytes: 26214400

read_timeout: "60s"
write_timeout: "60s"

# Certificate source shared by all TLS-enabled listeners.
#   mode: none   no certificate (only `none` listeners allowed)
#   mode: files  load a static cert_file/key_file you manage
#   mode: auto   obtain + auto-renew via ACME DNS-01 (certmagic); no inbound port needed
tls:
  mode: "none"
  # --- mode: files ---
  # cert_file: "/path/to/cert.pem"
  # key_file:  "/path/to/key.pem"
  # --- mode: auto (ACME DNS-01 via Cloudflare) ---
  # hostnames: ["smtp.example.com"]   # cert names; must be on the Cloudflare account
  # acme_email: "you@example.com"
  # dns_provider: "cloudflare"
  # cf_api_token: ""                  # or set $CLOUDFLARE_API_TOKEN (DNS:Edit scope)
  # storage_path: "./certs"           # MUST persist across restarts (LE rate limits)
  # ca_dir_url: ""                    # optional; e.g. LE staging while testing

# Network-level access control. SMTP credentials are per-route (see routes below);
# a sender authenticates AS a route and may only deliver to routes that credential
# owns. AUTH is mandatory.
auth:
  # Optional CIDR allowlist applied on top of AUTH. Empty = allow any source IP.
  allow_ips: []
    # - "10.0.0.0/8"
    # - "192.168.1.0/24"

# Optional message logging (opt-OUT). The database file is always used for the
# durable async delivery queue; this flag only controls whether message content
# and delivery history are persisted.
logging:
  enabled: true
  database: "./smtp-bridge.db"
  # Persist rejected requests (envelope metadata + reason, no message bodies) so
  # you can debug misconfigured senders with `smtp-bridge rejections`. Rejections
  # are always logged to stderr regardless; this only controls DB persistence.
  # Defaults to true; set false to disable.
  log_rejections: true

# Optional status web UI (view messages + rejections in a browser instead of the
# CLI; supports selecting and bulk-deleting captured messages). NO authentication
# — bind it to loopback only, or in
# a container publish it to the host loopback (e.g. compose `127.0.0.1:8025:8025`)
# and reach it over an SSH tunnel. Empty/absent = disabled.
web:
  listen: "" # e.g. "127.0.0.1:8025"

# Global delivery defaults. Individual routes may override `mode`.
delivery:
  default_mode: "async"   # async = accept + durable retry; sync = 250 only on 2xx
  timeout: "30s"          # per-attempt HTTP timeout
  max_retries: 5          # async only
  retry_backoff: "10s"    # async only; exponential (base * 2^(attempt-1))
  concurrency: 4          # async worker parallelism

# Each route carries its own SMTP credential (username + password/password_bcrypt),
# a recipient match, and an OPTIONAL webhook. A sender authenticates as the route's
# user; among that user's routes, the first whose match passes wins. A recipient
# with no matching route for the authenticated user is rejected at RCPT (SMTP 550).
#
# Generate a bcrypt hash with:  smtp-bridge hash 'the-password'
routes:
  - name: "myapp"
    username: "myapp"
    # Provide exactly one of password or password_bcrypt (bcrypt preferred).
    password_bcrypt: "$2a$10$......"
    # password: "change-me"
    match:
      # Every non-empty condition must match (AND). An empty match block is a
      # catch-all for this user. rcpt_localpart ignores any "+tag" suffix.
      rcpt_domain: "hooks.example.com"
      # rcpt_localpart: "myapp"
      # rcpt: "myapp@hooks.example.com"
    webhook:
      # Omit the webhook entirely to make this a CAPTURE-ONLY route: matching mail
      # is accepted and stored (see `smtp-bridge messages`) but not forwarded.
      # Capture-only routes require logging.enabled: true.
      url: "https://myapp.example.com/inbound-mail"
      method: "POST"
      # HMAC-SHA256 signing key. When set, each request carries
      # X-SMTP-Bridge-Signature: sha256=<hex of HMAC over the raw body>.
      secret: "a-long-random-signing-secret"
      headers:
        # Any extra static headers, e.g. an auth token for the receiving app.
        # Authorization: "Bearer ..."
    mode: "async"          # override delivery.default_mode for this route
    include:
      raw: false                 # include base64 of the full .eml as raw_eml_b64
      attachments: true          # include attachment bodies (base64) in the payload
      max_attachment_bytes: 10485760  # 0 = unlimited; larger attachments are marked truncated
