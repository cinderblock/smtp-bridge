# Deploy smtp-bridge to firefly.
#
# Runs on the isolated self-hosted runner that the ops repo provisions inside the
# smtp-bridge-runner container (labels: firefly, smtp-bridge). That container's
# supervisor runs this app as a restartable service. A deploy = build the static
# binary, stage it as a new release, flip the `current` symlink, and touch the
# restart sentinel; the container's restart-watcher then restarts the app.
#
# The app config (routes/users/TLS) is managed by ops and bind-mounted at
# /etc/smtp-bridge/config.yaml — this workflow never writes it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-firefly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, smtp-bridge]
    env:
      APP_DIR: /srv/smtp-bridge
    steps:
      - uses: actions/checkout@v4

      - name: Build static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o smtp-bridge ./cmd/smtp-bridge
          ./smtp-bridge -h 2>/dev/null || true  # sanity: binary is runnable

      - name: Run tests
        run: go test ./...

      - name: Stage release and restart
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          REL="${APP_DIR}/releases/${SHA}"
          mkdir -p "${REL}" "${APP_DIR}/data"
          install -m 0755 smtp-bridge "${REL}/smtp-bridge"
          install -m 0755 deploy/run "${REL}/run"
          ln -sfn "releases/${SHA}" "${APP_DIR}/current"
          touch "${APP_DIR}/restart"
          echo "Deployed ${SHA}; flipped current and signalled restart."
          # Keep the 5 most recent releases; prune the rest.
          ls -1dt "${APP_DIR}"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
